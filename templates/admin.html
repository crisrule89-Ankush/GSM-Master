<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin settings - GSM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { margin: 0; background: #f4f7fc; color: #253858; font-family: Poppins, Arial, sans-serif; }
        .admin-shell { max-width: 1100px; margin: 0 auto; padding: 28px 20px 50px; }
        .admin-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
        .admin-header h1 { margin: 0; font-size: 25px; color: #061a4c; }
        .admin-header p { margin: 5px 0 0; color: #718096; font-size: 13px; }
        .admin-card { background: #fff; border: 1px solid #e7edf5; border-radius: 14px; box-shadow: 0 8px 24px rgba(6, 26, 76, .06); padding: 24px; }
        #message { display: none; margin-bottom: 18px; padding: 12px 15px; border-radius: 8px; font-size: 13px; }
        .success-message { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .error-message { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
        .settings-row { display: grid; grid-template-columns: minmax(170px, 1fr) 170px minmax(240px, 1.5fr) minmax(170px, 1fr); align-items: center; gap: 10px; margin-bottom: 10px; }
        .settings-row label { margin: 0; font-size: 12px; font-weight: 600; }
        .settings-row .form-control, .settings-row .form-select { min-height: 38px; font-size: 12px; }
        .preview-value { color: #718096; font-size: 11px; }
        @media (max-width: 800px) { .settings-row { grid-template-columns: 1fr 1fr; } .preview-value { grid-column: 1 / -1; } }
        @media (max-width: 500px) { .settings-row { grid-template-columns: 1fr; } .preview-value { grid-column: auto; } }
    </style>
</head>
<body>
    <main class="admin-shell">
        <header class="admin-header">
            <div>
                <h1>Admin settings</h1>
                <p>Configure how fields appear on the GSM page.</p>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('dashboard') }}">Dashboard</a>
                <a class="btn btn-outline-primary btn-sm" href="{{ url_for('gsmmaster') }}">GSM page</a>
                <a class="btn btn-primary btn-sm" href="{{ url_for('upload_gsm') }}">Upload</a>
            </div>
        </header>

        <div id="message" aria-live="polite"></div>

        <section class="admin-card">
            <h2 class="h5 mb-2">GSM field settings</h2>
            <p class="text-muted small mb-4">Choose Textbox, Dropdown, or Date. Enter dropdown options separated by commas. Save to apply the settings; an open GSM page updates immediately.</p>
            <form id="field-settings-form">
                {% for field in gsm_columns %}
                <div class="settings-row">
                    <label for="field-control-{{ field }}">{{ field.replace("_", " ") }}</label>
                    <select class="form-select" id="field-control-{{ field }}" data-field-setting="{{ field }}">
                        {% for control_type in ["text", "dropdown", "date"] %}
                        <option value="{{ control_type }}"{% if field_settings[field]["type"] == control_type %} selected{% endif %}>{{ control_type|capitalize }}</option>
                        {% endfor %}
                    </select>
                    <input class="form-control" type="text" data-field-options="{{ field }}" value="{{ field_settings[field]["options"]|join(", ") }}" placeholder="Dropdown options (comma separated)">
                    <span class="preview-value" data-field-preview="{{ field }}"></span>
                </div>
                {% endfor %}
                <button class="btn btn-primary mt-2" type="submit"><i class="fa-solid fa-floppy-disk me-1"></i> Save field settings</button>
            </form>
        </section>
    </main>

    <script>
        const fieldSettingsForm = document.getElementById("field-settings-form");

        function showMessage(message, type) {
            const box = document.getElementById("message");
            box.className = type === "success" ? "success-message" : "error-message";
            box.textContent = message;
            box.style.display = "block";
        }

        function getFieldSetting(field) {
            const control = document.querySelector('[data-field-setting="' + field + '"]');
            const optionsInput = document.querySelector('[data-field-options="' + field + '"]');
            return {
                type: control ? control.value : "text",
                options: optionsInput ? optionsInput.value.split(",").map((option) => option.trim()).filter(Boolean) : []
            };
        }

        function updatePreview(field) {
            const setting = getFieldSetting(field);
            const preview = document.querySelector('[data-field-preview="' + field + '"]');
            if (!preview) return;
            preview.textContent = setting.type === "dropdown"
                ? "Dropdown: " + (setting.options.join(", ") || "no options yet")
                : "Control: " + setting.type;
        }

        document.querySelectorAll("[data-field-setting], [data-field-options]").forEach((control) => {
            const field = control.dataset.fieldSetting || control.dataset.fieldOptions;
            control.addEventListener("input", () => updatePreview(field));
            control.addEventListener("change", () => updatePreview(field));
            updatePreview(field);
        });

        fieldSettingsForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const fieldSettings = {};
            document.querySelectorAll("[data-field-setting]").forEach((control) => {
                fieldSettings[control.dataset.fieldSetting] = getFieldSetting(control.dataset.fieldSetting);
            });
            try {
                const response = await fetch("{{ url_for('admin_field_settings') }}", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ field_settings: fieldSettings })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok || !result.success) throw new Error(result.message || "Unable to save field settings.");
                localStorage.setItem("gsmFieldSettingsUpdated", JSON.stringify(result.data));
                showMessage(result.message || "GSM field settings saved.", "success");
            } catch (error) {
                showMessage(error.message, "error");
            }
        });
    </script>
</body>
</html>
